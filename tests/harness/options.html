<!doctype html>
<!-- Renders the real options page against an in-memory chrome.storage seeded with sample history. -->
<html lang="en">
<head><meta charset="utf-8"><title>Feedwall options harness</title><link rel="stylesheet" href="../../src/ui/ui.css">
<style>main { max-width: 800px; margin: 0 auto; padding: 28px 16px 60px; } header { margin-bottom: 18px; }</style></head>
<body>
<script>
(async () => {
  const mark = (key, p, verdict, topicId, text) => ({ key, p, verdict, topicId, site: "x", state: { site: "x", text } });
  const hidden = (key, topicId, topicName, p, author, text) => ({ key, topicId, topicName, p, author, text, site: "x", ts: Date.now(), state: { site: "x", text } });
  const store = {
    settings: { apiKey: "seeded", aboutMe: "I build small iOS apps on my own.", focusSites: [],
      topics: [
        { id: "indie_building", name: "Indie building", action: "keep", description: "Is this post about building, launching, pricing, or marketing a small software product?",
          counts: "Build logs, launch write-ups, revenue numbers.", notCounts: "Generic motivation, course ads.", examples: { yes: ["Hit $1k MRR with my habit tracker after raising the price from $3 to $5"], no: [] } },
        { id: "engagement_bait", name: "Engagement bait", action: "hide", description: "Is this post engagement bait?", counts: "Comment X and I will DM you.", notCounts: "A real opinion or update." },
        { id: "ai_slop", name: "Generic filler", action: "hide", description: "Is this post generic filler with nothing specific in it?", threshold: 0.75 },
        { id: "politics", name: "Politics", action: "dim", description: "Is this post about partisan politics?", sites: ["x", "reddit"], enabled: false },
      ] },
    recent: [
      hidden("k1", "engagement_bait", "Engagement bait", 0.97, "Growth Guru", "Comment 'GUIDE' below and I'll DM you my 47-page playbook for free."),
      hidden("k2", "ai_slop", "Generic filler", 0.78, "Dana Builds", "Three things I learned shipping dark mode: tokens first, screenshots in CI, and never trust a hex value."),
      hidden("k3", "rage_bait", "Rage bait", 0.93, "Hot Takes Daily", "Anyone who still uses tabs instead of spaces is a brain-dead idiot."),
    ],
    feedback: [
      ...[0.76, 0.78, 0.8, 0.82].map((p, i) => mark("w" + i, p, "wrong", "ai_slop", "A specific post wrongly hidden " + i)),
      ...[0.9, 0.92, 0.94, 0.95, 0.97, 0.99].map((p, i) => mark("r" + i, p, "right", "ai_slop", "Generic filler correctly hidden " + i)),
      ...[0.6, 0.66, 0.7].map((p, i) => mark("m" + i, p, "missed", "engagement_bait", "Bait that slipped through " + i)),
      mark("k1", 0.97, "right", "engagement_bait", "Comment GUIDE below"),
    ],
  };
  const listeners = [];
  window.chrome = {
    storage: { local: {
      get: async (keys) => Object.fromEntries([].concat(keys).filter((k) => k in store).map((k) => [k, structuredClone(store[k])])),
      set: async (patch) => { Object.assign(store, structuredClone(patch)); },
    }, onChanged: { addListener: (fn) => listeners.push(fn) } },
    runtime: { sendMessage: async (message) => {
      if (message.type === "feedback") store.feedback = FW.stats.addFeedback(store.feedback, message.entry);
      if (message.type === "testTopic") {
        const posts = [["Launched my habit tracker today: $5/month, 40 paying users in the first week. Full numbers inside.", 0.96], ["Raised prices from $3 to $5 and churn did not move. Notes on what I tested.", 0.91],
          ["Hot take: most indie hackers should just get a job.", 0.58], ["Comment GUIDE and I will DM you my 47-page playbook.", 0.12], ["Anyone know a good way to debounce scroll handlers?", 0.04]];
        return { results: posts.map(([text, p], i) => ({ key: "s" + i, p, text, site: "x", author: "someone", state: { site: "x", text } })), failed: 0, tokens: 900, threshold: 0.75 };
      }
      return { ok: true };
    } },
  };
  const html = await (await fetch("../../src/ui/options.html")).text();
  const doc = new DOMParser().parseFromString(html, "text/html");
  document.body.append(...doc.body.querySelectorAll("main"));
  for (const src of ["core/topics.js", "core/judge.js", "core/stats.js", "ui/options.js"]) {
    await new Promise((resolve, reject) => { const s = document.createElement("script"); s.src = "../../src/" + src; s.onload = resolve; s.onerror = reject; document.body.append(s); });
  }
  // Scripted scenes (?scene=editor | report) so screenshots and the demo video can be regenerated.
  const scene = new URLSearchParams(location.search).get("scene");
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const jump = (el, offset) => window.scrollTo(0, el.getBoundingClientRect().top + window.scrollY - (offset || 12));
  await wait(150);
  if (scene === "editor") {
    document.getElementById("new-topic").click();
    const set = (id, value) => { const el = document.getElementById(id); el.value = value; el.dispatchEvent(new Event("input")); };
    set("t-name", "Pricing experiments");
    set("t-description", "Posts sharing the result of a pricing change on a software product");
    set("t-counts", "Before-and-after numbers, what was tested");
    set("t-not", "General pricing advice with no result");
    document.getElementById("t-test").click();
    await wait(200);
    jump(document.getElementById("t-test-out"), 250); // keep the last fields in view, and show the results
  }
  if (scene === "report") jump(document.getElementById("review"));
})();
</script>
</body>
</html>
