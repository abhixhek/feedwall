<!doctype html>
<!-- One captioned frame of the demo video: scene.html?caption=...&src=<bench url>. Used by scripts/make_demo.sh. -->
<html lang="en"><head><meta charset="utf-8"><title>Feedwall demo scene</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0a; overflow: hidden; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .bar { height: 92px; display: flex; align-items: center; gap: 18px; padding: 0 36px; color: #f5f4ef; border-bottom: 1px solid #2a2a27; }
  .logo { width: 40px; height: 40px; flex: none; }
  .step { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #8d8c83; }
  .caption { font-size: 25px; font-weight: 650; letter-spacing: -0.015em; line-height: 1.2; }
  iframe { display: block; width: 100%; height: calc(100% - 93px); border: 0; background: #000; }
  .end { height: 100%; display: grid; place-items: center; text-align: center; color: #f5f4ef; }
  .end h1 { font-size: 64px; margin: 18px 0 10px; letter-spacing: -0.03em; } .end p { font-size: 26px; margin: 6px 0; color: #c3c2b7; } .end .url { color: #5ea0ff; font-size: 30px; margin-top: 26px; }
</style></head><body>
<script>
  const q = new URLSearchParams(location.search);
  const logo = '<img class="logo" src="../../icons/128.png" alt="">';
  if (q.get("end") === "1") {
    document.body.innerHTML = `<div class="end"><div><img src="../../icons/128.png" width="96" height="96" alt=""><h1>Feedwall</h1>
      <p>Your feed, your rules, in plain English.</p><p>Open source. No server. Bring your own key.</p><div class="url">github.com/abhixhek/feedwall</div></div></div>`;
  } else {
    const bar = document.createElement("div"); bar.className = "bar";
    bar.innerHTML = logo + '<div><div class="step"></div><div class="caption"></div></div>';
    bar.querySelector(".step").textContent = q.get("step") || "";
    bar.querySelector(".caption").textContent = q.get("caption") || "";
    const frame = document.createElement("iframe"); frame.src = q.get("src");
    document.body.append(bar, frame);
  }
</script></body></html>
